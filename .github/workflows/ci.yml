name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, r1/sim-core ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|h5py)' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          # TODO: Remove osmnx and pyproj line below once R2's PR merges them into requirements.txt
          pip install flake8 pytest osmnx pyproj

      - name: Lint with Flake8
        run: |
          flake8 src/sim tests/test_sim.py --max-line-length=100

      - name: Run Pytest Suite
        run: |
          pytest --ignore=tests/test_prediction.py -q
      - name: Test with pytest
        env:
          PYTHONPATH: .
        run: |
          pytest --ignore=tests/test_prediction.py -q