name: R4 allocation checks
on:
  pull_request:
    paths:
      - 'src/allocation/**'
      - 'tests/test_allocation*'
      - 'requirements-r4.txt'
      - '.github/workflows/r4.yml'
jobs:
  allocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-r4.txt
      - run: python -m pytest tests/test_allocation* -q
      - run: python -m flake8 src/allocation tests/test_allocation* --max-line-length=100
